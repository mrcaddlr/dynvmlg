<script type="module">
  import {
    addPondiverseButton,
    fetchPondiverseCreation,
  } from "/libraries/pondiverse.js";

  const offscreenCanvas = document.createElement("canvas");
  const offscreenContext = offscreenCanvas.getContext("2d");

  requestAnimationFrame(() => {
    addPondiverseButton(() => {
      const canvases = document.querySelectorAll("canvas");
      const canvas = canvases[0];
      const paddleCanvas = canvases[1];
      offscreenCanvas.width = canvas.width;
      offscreenCanvas.height = canvas.height;
      offscreenContext.fillStyle = Colour.Void;
      offscreenContext.fillRect(0, 0, canvas.width, canvas.height);
      offscreenContext.drawImage(canvas, 0, 0);
      offscreenContext.drawImage(paddleCanvas, 0, 0);
      // const world = packWorld();
      return {
        type: "cellpond",
        data: JSON.stringify({
          paddles: packPaddles(),
          // world,
        }),
        image: offscreenCanvas.toDataURL("image/png"),
      };
    });
  });

  const urlSearchParams = new URLSearchParams(window.location.search);
  const pondiverseCreation = urlSearchParams.get("creation");
  if (pondiverseCreation) {
    fetchPondiverseCreation(pondiverseCreation).then((creation) => {
      const file = JSON.parse(creation.data);
      const paddles = file.paddles;
      unpackPaddles(paddles);
      const world = file.world;
      if (world) {
        // unpackWorld(world);
      }
    });
  }
</script>

<style>

    --ui-bg:rgba(12,14,18,.86);

  #cellpond-ui{position:fixed;inset:0;z-index:100;pointer-events:none;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ui-text)}

  .cp-btn{

  #cellpond-toolbar-controls{
    position:fixed;top:76px;left:50%;transform:translateX(-50%);display:flex;gap:6px;

<div id="cellpond-ui" aria-hidden="true">
  <div id="cellpond-title">CellPond</div>
  <div id="cellpond-topbar">
    <button class="cp-btn" id="cp-pause">pause</button>
    <button class="cp-btn" id="cp-fit">fit</button>
  </div>
  <div id="cellpond-toolbar-controls">
    <button class="cp-btn cp-arrow" id="cp-left" aria-label="scroll tools left">‹</button>
    <button class="cp-btn cp-arrow" id="cp-right" aria-label="scroll tools right">›</button>
  </div>
  <div id="cellpond-resize-handle" title="drag to resize the board"></div>
  <div id="cellpond-size-readout"></div>
</div>
<script>
(()=> {
  const handle=document.getElementById("cellpond-resize-handle");
  const readout=document.getElementById("cellpond-size-readout");
  const pause=document.getElementById("cp-pause");
  const fit=document.getElementById("cp-fit");
  const left=document.getElementById("cp-left");
  const right=document.getElementById("cp-right");
  let drag=null;

  const sync=()=> {
    const api=window.CellPond;
    if(!api){requestAnimationFrame(sync);return}
    const rect=api.getBoardRect();
    handle.style.left=Math.round(rect.left+rect.width-8)+"px";
    handle.style.top=Math.round(rect.top+rect.height-8)+"px";
    readout.style.left=Math.round(rect.left+rect.width-68)+"px";
    readout.style.top=Math.round(rect.top+rect.height+9)+"px";
    readout.textContent=Math.round(rect.width)+" × "+Math.round(rect.height);
    requestAnimationFrame(sync);
  };

  const scrollTools=(amount)=>{
    const api=window.CellPond;
    if(!api)return;
    const state=api.getToolbarState();
    api.setToolbarScroll(state.scroll+amount);
  };

  left.addEventListener("click",()=>scrollTools(-220));
  right.addEventListener("click",()=>scrollTools(220));
  fit.addEventListener("click",()=>window.CellPond?.fitBoard());
  pause.addEventListener("click",()=>{
    window.CellPond?.togglePause();
    pause.textContent=pause.textContent==="pause"?"play":"pause";
  });

  handle.addEventListener("pointerdown",(event)=>{
    const api=window.CellPond;
    if(!api||event.button!==0)return;
    const rect=api.getBoardRect();
    drag={startX:event.clientX,startY:event.clientY,startScale:rect.scale};
    handle.setPointerCapture(event.pointerId);
    readout.style.opacity="1";
    readout.style.transform="translateY(0)";
    event.preventDefault();
  });
  handle.addEventListener("pointermove",(event)=>{
    if(!drag||!window.CellPond)return;
    const delta=Math.max(event.clientX-drag.startX,event.clientY-drag.startY);
    window.CellPond.setBoardScale(drag.startScale*(1+delta/420));
    event.preventDefault();
  });
  const endDrag=()=>{
    drag=null;
    readout.style.opacity="";
    readout.style.transform="";
  };
  handle.addEventListener("pointerup",endDrag);
  handle.addEventListener("pointercancel",endDrag);

  sync();
})();
</script>
