<script type="module">
  import {
    addPondiverseButton,
    fetchPondiverseCreation,
  } from "/libraries/pondiverse.js";

  const offscreenCanvas = document.createElement("canvas");
  const offscreenContext = offscreenCanvas.getContext("2d");

  requestAnimationFrame(() => {
    addPondiverseButton(() => {
      const canvases = document.querySelectorAll("canvas");
      const canvas = canvases[0];
      const paddleCanvas = canvases[1];
      offscreenCanvas.width = canvas.width;
      offscreenCanvas.height = canvas.height;
      offscreenContext.fillStyle = Colour.Void;
      offscreenContext.fillRect(0, 0, canvas.width, canvas.height);
      offscreenContext.drawImage(canvas, 0, 0);
      offscreenContext.drawImage(paddleCanvas, 0, 0);
      // const world = packWorld();
      return {
        type: "cellpond",
        data: JSON.stringify({
          paddles: packPaddles(),
          // world,
        }),
        image: offscreenCanvas.toDataURL("image/png"),
      };
    });
  });

  const urlSearchParams = new URLSearchParams(window.location.search);
  const pondiverseCreation = urlSearchParams.get("creation");
  if (pondiverseCreation) {
    fetchPondiverseCreation(pondiverseCreation).then((creation) => {
      const file = JSON.parse(creation.data);
      const paddles = file.paddles;
      unpackPaddles(paddles);
      const world = file.world;
      if (world) {
        // unpackWorld(world);
      }
    });
  }
</script>

<style>
  #cellpond-ui{position:fixed;inset:0;z-index:100;pointer-events:none}
  #cellpond-resize-handle{
    position:fixed;width:18px;height:18px;border-radius:4px;box-sizing:border-box;
    border:1px solid rgba(255,255,255,.45);
    background:
      linear-gradient(135deg,transparent 44%,rgba(255,255,255,.75) 45%,rgba(255,255,255,.75) 52%,transparent 53%),

  }
  #cellpond-size-readout{
    position:fixed;padding:4px 7px;border-radius:6px;
    background:rgba(14,16,20,.88);border:1px solid rgba(255,255,255,.1);
    color:rgba(255,255,255,.9);font:11px/1 system-ui,sans-serif;white-space:nowrap;pointer-events:none
  }
</style>
<div id="cellpond-ui" aria-hidden="true">
  <div id="cellpond-resize-handle" title="drag to resize the board"></div>
  <div id="cellpond-size-readout"></div>
</div>
<script>
(()=> {
  const handle=document.getElementById("cellpond-resize-handle");
  const readout=document.getElementById("cellpond-size-readout");
  let drag=null;
  const sync=()=> {
    const api=window.CellPond;
    if(!api){requestAnimationFrame(sync);return}
    const rect=api.getBoardRect();
    handle.style.left=Math.round(rect.left+rect.width-9)+"px";
    handle.style.top=Math.round(rect.top+rect.height-9)+"px";
    readout.style.left=Math.round(rect.left+rect.width-84)+"px";
    readout.style.top=Math.round(rect.top+rect.height+8)+"px";
    readout.textContent="board "+Math.round(rect.width)+" × "+Math.round(rect.height);
    requestAnimationFrame(sync);
  };
  handle.addEventListener("pointerdown",(event)=>{
    const api=window.CellPond;
    if(!api||event.button!==0)return;
    const rect=api.getBoardRect();
    drag={startX:event.clientX,startY:event.clientY,startScale:rect.scale};
    handle.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  handle.addEventListener("pointermove",(event)=>{
    if(!drag||!window.CellPond)return;
    const delta=Math.max(event.clientX-drag.startX,event.clientY-drag.startY);
    window.CellPond.setBoardScale(drag.startScale*(1+delta/420));
    event.preventDefault();
  });
  handle.addEventListener("pointerup",()=>{drag=null});
  handle.addEventListener("pointercancel",()=>{drag=null});
  sync();
})();
</script>
