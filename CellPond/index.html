<script type="module">
  import {
    addPondiverseButton,
    fetchPondiverseCreation,
  } from "/libraries/pondiverse.js";

  const offscreenCanvas = document.createElement("canvas");
  const offscreenContext = offscreenCanvas.getContext("2d");

  requestAnimationFrame(() => {
    addPondiverseButton(() => {
      const canvases = document.querySelectorAll("canvas");
      const canvas = canvases[0];
      const paddleCanvas = canvases[1];
      offscreenCanvas.width = canvas.width;
      offscreenCanvas.height = canvas.height;
      offscreenContext.fillStyle = Colour.Void;
      offscreenContext.fillRect(0, 0, canvas.width, canvas.height);
      offscreenContext.drawImage(canvas, 0, 0);
      offscreenContext.drawImage(paddleCanvas, 0, 0);
      // const world = packWorld();
      return {
        type: "cellpond",
        data: JSON.stringify({
          paddles: packPaddles(),
          // world,
        }),
        image: offscreenCanvas.toDataURL("image/png"),
      };
    });
  });

  const urlSearchParams = new URLSearchParams(window.location.search);
  const pondiverseCreation = urlSearchParams.get("creation");
  if (pondiverseCreation) {
    fetchPondiverseCreation(pondiverseCreation).then((creation) => {
      const file = JSON.parse(creation.data);
      const paddles = file.paddles;
      unpackPaddles(paddles);
      const world = file.world;
      if (world) {
        // unpackWorld(world);
      }
    });
  }
</script>

<style>
  :root{--cp-panel:rgba(12,14,18,.82);--cp-panel2:rgba(18,20,25,.92);--cp-line:rgba(255,255,255,.11);--cp-text:rgba(255,255,255,.9);--cp-muted:rgba(255,255,255,.48)}
  #cellpond-ui{position:fixed;inset:0;z-index:100;pointer-events:none;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--cp-text)}
  #cp-brand{position:fixed;left:14px;top:12px;display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--cp-line);border-radius:12px;background:var(--cp-panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 28px rgba(0,0,0,.18)}

  #cp-sub{font-size:10px;color:var(--cp-muted);margin-left:2px}
  #cp-actions{position:fixed;right:12px;top:11px;display:flex;gap:5px;padding:5px;border:1px solid var(--cp-line);border-radius:12px;background:var(--cp-panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 28px rgba(0,0,0,.18);pointer-events:auto}
  .cp-btn{appearance:none;border:1px solid transparent;border-radius:8px;background:rgba(255,255,255,.055);color:var(--cp-text);height:28px;padding:0 10px;font:600 11px system-ui,sans-serif;cursor:pointer;transition:background .12s,border-color .12s}

<script>
(()=> {
  const handle=document.getElementById("cellpond-resize-handle"), readout=document.getElementById("cellpond-size-readout");
  const pause=document.getElementById("cp-pause"), fit=document.getElementById("cp-fit"), left=document.getElementById("cp-left"), right=document.getElementById("cp-right"), trash=document.getElementById("cp-trash");
  let drag=null;
  const sync=()=>{const api=window.CellPond;if(!api){requestAnimationFrame(sync);return}const r=api.getBoardRect();handle.style.left=Math.round(r.left+r.width-8)+"px";handle.style.top=Math.round(r.top+r.height-8)+"px";readout.style.left=Math.round(r.left+r.width-66)+"px";readout.style.top=Math.round(r.top+r.height+8)+"px";readout.textContent=Math.round(r.width)+" × "+Math.round(r.height);requestAnimationFrame(sync)};
  const scroll=n=>{const a=window.CellPond;if(!a)return;const t=a.getToolbarState();a.setToolbarScroll(t.scroll+n)};
  left.onclick=()=>scroll(-220);right.onclick=()=>scroll(220);fit.onclick=()=>window.CellPond?.fitBoard();
  trash.onpointerdown=e=>{e.preventDefault();};
  trash.onclick=()=>window.CellPond?.trashDragged();
  trash.ondragover=e=>{e.preventDefault();trash.classList.add("drag-over")};
  trash.ondragleave=()=>trash.classList.remove("drag-over");
  trash.onpointerup=e=>{e.preventDefault();trash.classList.remove("drag-over");window.CellPond?.trashDragged()};
  pause.onclick=()=>{window.CellPond?.togglePause();pause.textContent=pause.textContent==="pause"?"play":"pause"};
  handle.onpointerdown=e=>{const a=window.CellPond;if(!a||e.button!==0)return;const r=a.getBoardRect();drag={x:e.clientX,y:e.clientY,s:r.scale};handle.classList.add("dragging");readout.classList.add("visible");handle.setPointerCapture(e.pointerId);e.preventDefault()};
  handle.onpointermove=e=>{if(!drag||!window.CellPond)return;const d=Math.max(e.clientX-drag.x,e.clientY-drag.y);window.CellPond.setBoardScale(drag.s*(1+d/420));e.preventDefault()};
  const end=()=>{drag=null;handle.classList.remove("dragging");readout.classList.remove("visible")};
  handle.onpointerup=end;handle.onpointercancel=end;
  sync();
})();
</script>
