<script type="module">
  import {
    addPondiverseButton,
    fetchPondiverseCreation,
  } from "/libraries/pondiverse.js";

  const offscreenCanvas = document.createElement("canvas");
  const offscreenContext = offscreenCanvas.getContext("2d");

  requestAnimationFrame(() => {
    addPondiverseButton(() => {
      const canvases = document.querySelectorAll("canvas");
      const canvas = canvases[0];
      const paddleCanvas = canvases[1];
      offscreenCanvas.width = canvas.width;
      offscreenCanvas.height = canvas.height;
      offscreenContext.fillStyle = Colour.Void;
      offscreenContext.fillRect(0, 0, canvas.width, canvas.height);
      offscreenContext.drawImage(canvas, 0, 0);
      offscreenContext.drawImage(paddleCanvas, 0, 0);
      // const world = packWorld();
      return {
        type: "cellpond",
        data: JSON.stringify({
          paddles: packPaddles(),
          // world,
        }),
        image: offscreenCanvas.toDataURL("image/png"),
      };
    });
  });

  const urlSearchParams = new URLSearchParams(window.location.search);
  const pondiverseCreation = urlSearchParams.get("creation");
  if (pondiverseCreation) {
    fetchPondiverseCreation(pondiverseCreation).then((creation) => {
      const file = JSON.parse(creation.data);
      const paddles = file.paddles;
      unpackPaddles(paddles);
      const world = file.world;
      if (world) {
        // unpackWorld(world);
      }
    });
  }
</script>

<div id="cellpond-ui" aria-hidden="true">
  <div id="cp-brand"><div id="cp-mark"></div><div id="cp-name">CellPond</div><div id="cp-sub">visual programming</div></div>

  <div id="cp-paddle-scroll" aria-label="Programming rules scroll"><div id="cp-paddle-thumb"></div></div>

    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M7 7l1 13h8l1-13"/><path d="M10 11v5"/><path d="M14 11v5"/></svg>
  </button>

<script>
(()=> {
  const handle=document.getElementById("cellpond-resize-handle");
  const readout=document.getElementById("cellpond-size-readout");
  const pause=document.getElementById("cp-pause");
  const fit=document.getElementById("cp-fit");
  const scrollTrack=document.getElementById("cp-paddle-scroll");
  const scrollThumb=document.getElementById("cp-paddle-thumb");
  const trash=document.getElementById("cp-trash");

  let drag=null;
  let scrollDrag=null;

  const sync=()=>{
    const api=window.CellPond;
    if(!api){requestAnimationFrame(sync);return}

    const r=api.getBoardRect();
    handle.style.left=Math.round(r.left+r.width-9)+"px";
    handle.style.top=Math.round(r.top+r.height-9)+"px";

    readout.style.left=Math.round(r.left+r.width-70)+"px";
    readout.style.top=Math.round(r.top+r.height+8)+"px";
    readout.textContent=Math.round(r.width)+" × "+Math.round(r.height);

    const p=api.getPaddleScrollState?.();
    if(p){
      const overflow=Math.max(0,p.max-p.min);
      scrollTrack.classList.toggle("visible",overflow>0);
      if(overflow>0){
        const trackHeight=scrollTrack.clientHeight-4;
        const thumbHeight=Math.max(26,Math.min(trackHeight,trackHeight*(p.viewport/Math.max(p.content,p.viewport))));
        const travel=Math.max(0,trackHeight-thumbHeight);
        const ratio=p.max===p.min?0:(p.max-p.scroll)/(p.max-p.min);
        scrollThumb.style.height=Math.round(thumbHeight)+"px";
        scrollThumb.style.top=Math.round(2+travel*ratio)+"px";
      }
    }

    requestAnimationFrame(sync);
  };

  fit.onclick=()=>window.CellPond?.fitBoard();
  pause.onclick=()=>{
    window.CellPond?.togglePause();
    pause.textContent=pause.textContent==="pause"?"play":"pause";
  };

  handle.onpointerdown=e=>{
    const api=window.CellPond;
    if(!api||e.button!==0)return;
    const r=api.getBoardRect();
    drag={x:e.clientX,y:e.clientY,w:r.width,h:r.height,scale:r.scale};
    handle.classList.add("dragging");
    readout.classList.add("visible");
    handle.setPointerCapture(e.pointerId);
    e.preventDefault();
  };
  handle.onpointermove=e=>{
    if(!drag||!window.CellPond)return;
    const w=drag.w+(e.clientX-drag.x);
    const h=drag.h+(e.clientY-drag.y);
    window.CellPond.setBoardSize(w*window.devicePixelRatio/drag.scale,h*window.devicePixelRatio/drag.scale);
    e.preventDefault();
  };
  const endResize=()=>{
    drag=null;
    handle.classList.remove("dragging");
    readout.classList.remove("visible");
  };
  handle.onpointerup=endResize;
  handle.onpointercancel=endResize;

  scrollThumb.onpointerdown=e=>{
    const api=window.CellPond;
    if(!api)return;
    scrollDrag={y:e.clientY,start:api.getPaddleScrollState().scroll};
    scrollThumb.setPointerCapture(e.pointerId);
    e.preventDefault();
  };
  scrollThumb.onpointermove=e=>{
    if(!scrollDrag||!window.CellPond)return;
    const p=window.CellPond.getPaddleScrollState();
    const trackHeight=scrollTrack.clientHeight-4;
    const thumbHeight=Math.max(26,Math.min(trackHeight,trackHeight*(p.viewport/Math.max(p.content,p.viewport))));
    const travel=Math.max(1,trackHeight-thumbHeight);
    const dy=e.clientY-scrollDrag.y;
    const delta=-(dy/travel)*(p.max-p.min);
    window.CellPond.setPaddleScroll(scrollDrag.start+delta);
    e.preventDefault();
  };
  const endScroll=()=>{scrollDrag=null};
  scrollThumb.onpointerup=endScroll;
  scrollThumb.onpointercancel=endScroll;
  scrollTrack.onpointerdown=e=>{
    if(e.target===scrollThumb)return;
    const p=window.CellPond?.getPaddleScrollState();
    if(!p)return;
    const rect=scrollTrack.getBoundingClientRect();
    const ratio=Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height));
    window.CellPond.setPaddleScroll(p.max-(p.max-p.min)*ratio);
  };

  trash.onpointerdown=e=>{e.preventDefault()};
  trash.onclick=()=>window.CellPond?.trashDragged();
  trash.ondragover=e=>{e.preventDefault();trash.classList.add("drag-over")};
  trash.ondragleave=()=>trash.classList.remove("drag-over");
  trash.onpointerup=e=>{e.preventDefault();trash.classList.remove("drag-over");window.CellPond?.trashDragged()};

  sync();
})();
</script>
